name: Continuous Integration

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Build & Lint Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pytest pytest-cov
          pip install -e .

      - name: Check Formatting with Black
        run: |
          black --check src tests scripts

      - name: Check Import Sorting with isort
        run: |
          isort --check-only src tests scripts

      - name: Lint with Flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 src tests scripts --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. Max complexity = 15
          flake8 src tests scripts --count --exit-zero --max-complexity=15 --max-line-length=100 --statistics

      - name: Run Unit Tests with Pytest
        run: |
          pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-python-${{ matrix.python-version }}
          path: coverage.xml
        if: always()